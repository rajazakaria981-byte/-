<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Red Spider Lily</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,#24101c 0,#09070d 55%,#030306 100%);color:#f5dce5;font-family:Georgia,serif;overflow:hidden}
main{text-align:center;width:min(96vw,760px);padding:24px 12px}h1{font-size:clamp(22px,4vw,34px);letter-spacing:.32em;font-weight:400;margin:0 0 8px;text-shadow:0 0 22px #d52b60}p{font:12px system-ui;letter-spacing:.25em;color:#b58c9f;margin:0 0 12px}canvas{display:block;width:100%;max-width:650px;height:auto;margin:auto;filter:drop-shadow(0 0 25px #a21d4a55)}
</style></head>
<body><main><h1>RED SPIDER LILY</h1><p>彼岸花 · A FLOWER IN THE NIGHT</p><canvas id="art" width="700" height="760"></canvas></main>
<script>
const c=document.getElementById('art'),ctx=c.getContext('2d'),W=c.width,H=c.height,cx=350,cy=305;
const stars=Array.from({length:110},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.3,p:Math.random()*6.28}));
const dust=Array.from({length:48},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+0.7,p:Math.random()*6.28}));
function petal(a,t,i){const len=190+15*Math.sin(i*2.1),r=len*t,bend=42*Math.sin(Math.PI*t)+44*t*t*t;return{x:cx+r*Math.cos(a)-bend*Math.sin(a),y:cy+r*Math.sin(a)+bend*Math.cos(a)}}
function draw(ms){const time=ms/1000;ctx.clearRect(0,0,W,H);
const bg=ctx.createRadialGradient(cx,cy,10,cx,cy,390);bg.addColorStop(0,'#32102133');bg.addColorStop(1,'#03030600');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
for(const s of stars){ctx.globalAlpha=.18+.35*(.5+.5*Math.sin(time+s.p));ctx.fillStyle='#e8b5ca';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()}ctx.globalAlpha=1;
ctx.lineCap='round';ctx.beginPath();ctx.moveTo(346,cy+4);ctx.bezierCurveTo(337,430,362,510,350,620);ctx.strokeStyle='#477b49';ctx.lineWidth=7;ctx.stroke();
for(const side of [-1,1]){ctx.beginPath();ctx.moveTo(350,560);ctx.bezierCurveTo(350+side*80,520,350+side*160,535,350+side*225,600);ctx.bezierCurveTo(350+side*145,580,350+side*80,565,350,560);ctx.fillStyle='#244a36';ctx.fill();ctx.strokeStyle='#73945a';ctx.lineWidth=2;ctx.stroke()}
for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/2;ctx.beginPath();for(let j=0;j<=100;j++){const q=petal(a,j/100,i);if(!j)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y)}ctx.globalAlpha=.18;ctx.strokeStyle='#d51e50';ctx.lineWidth=17;ctx.stroke();ctx.globalAlpha=1;ctx.strokeStyle='#ed315e';ctx.lineWidth=5;ctx.stroke();ctx.strokeStyle='#ff9caf';ctx.globalAlpha=.8;ctx.lineWidth=1.2;ctx.stroke();ctx.globalAlpha=1}
for(let i=0;i<24;i++){const a=i*Math.PI*2/24,l=82+16*Math.sin(i*3.7),sway=Math.sin(time*1.8+i)*3,x=cx+Math.cos(a)*l+sway,y=cy+Math.sin(a)*l*.8;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*8,cy+Math.sin(a)*8);ctx.quadraticCurveTo(cx+Math.cos(a)*l*.5+sway,cy+Math.sin(a)*l*.5,x,y);ctx.strokeStyle='#f3a0b4';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#ffd77a';ctx.shadowColor='#ffbd59';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(x,y,3.2,0,7);ctx.fill();ctx.shadowBlur=0}
const glow=ctx.createRadialGradient(cx,cy,2,cx,cy,85);glow.addColorStop(0,'#ff8ba744');glow.addColorStop(1,'#c51c4900');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,cy,85,0,7);ctx.fill();
for(const d of dust){const x=d.x+Math.sin(time+d.p)*8,y=(d.y-time*8%H+H)%H;ctx.globalAlpha=.2+.45*(.5+.5*Math.sin(time*2+d.p));ctx.fillStyle='#ffc0d2';ctx.shadowColor='#ff7da7';ctx.shadowBlur=10;ctx.beginPath();ctx.arc(x,y,d.r,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0;requestAnimationFrame(draw)}
requestAnimationFrame(draw);
</script></body></html>
