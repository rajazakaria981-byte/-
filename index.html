<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE ENTITY — AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#eee;font-family:Arial,sans-serif;min-height:100vh;overflow:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 40%,#280606 0,transparent 42%),repeating-linear-gradient(0deg,transparent 0 3px,#fff1 4px);opacity:.12}
.app{min-height:100vh;display:grid;grid-template-columns:1fr 420px;gap:20px;padding:24px;align-items:center}
.stage{height:calc(100vh - 48px);position:relative;display:flex;align-items:center;justify-content:center}
.character{position:relative;width:290px;height:510px;filter:drop-shadow(0 0 35px #500)}
.head{width:190px;height:220px;background:linear-gradient(145deg,#191919,#050505);border:2px solid #333;border-radius:48% 48% 42% 42%;margin:auto;position:relative}
.hood{position:absolute;inset:-22px -28px -8px;border:2px solid #171717;border-radius:50% 50% 30% 30%;z-index:-1}
.eyes{display:flex;gap:34px;position:absolute;top:80px;left:39px}
.eye{width:52px;height:23px;background:#050505;border-radius:50%;border:1px solid #555;overflow:hidden}
.pupil{width:10px;height:10px;background:#ddd;border-radius:50%;margin:5px auto;box-shadow:0 0 10px #fff}
.mouth{position:absolute;width:55px;height:5px;background:#777;left:67px;bottom:55px;border-radius:50%}
.body{width:230px;height:250px;background:linear-gradient(160deg,#151515,#020202);margin:-5px auto;border-radius:55px 55px 15px 15px;border:2px solid #1d1d1d}
.panel{background:#0a0a0acc;border:1px solid #292929;border-radius:20px;padding:16px;box-shadow:0 0 45px #000;height:650px;display:flex;flex-direction:column}
.title{font-size:18px;letter-spacing:4px;color:#b55;margin-bottom:4px}.status{font-size:12px;color:#777;margin-bottom:14px}
.messages{flex:1;overflow:auto;padding:5px}.msg{padding:10px 12px;border-radius:12px;margin:8px 0;line-height:1.55}.me{background:#171717}.ai{background:#210909;border:1px solid #381313}
.controls{display:flex;gap:8px;margin-top:10px}input{flex:1;background:#080808;border:1px solid #333;color:#fff;border-radius:10px;padding:13px;outline:none}button{background:#180707;border:1px solid #4b1717;color:#fff;border-radius:10px;padding:0 18px;cursor:pointer}
button:hover{background:#2b0a0a}.key{margin-top:10px}.key input{width:100%}.hint{font-size:11px;color:#666;margin-top:7px;line-height:1.4}
@media(max-width:850px){body{overflow:auto}.app{grid-template-columns:1fr;padding:12px}.stage{height:55vh}.panel{height:500px}.character{transform:scale(.8)}}
</style>
</head>
<body>
<div class="app">
<section class="stage">
<div class="character">
<div class="head"><div class="hood"></div><div class="eyes"><div class="eye"><div class="pupil"></div></div><div class="eye"><div class="pupil"></div></div></div><div class="mouth"></div></div>
<div class="body"></div>
</div>
</section>
<section class="panel">
<div class="title">THE ENTITY</div>
<div class="status">AI CONVERSATION // ONLINE</div>
<div id="messages" class="messages"><div class="msg ai">أنا هنا. اسألني أي سؤال وسأحاول الإجابة عليه.</div></div>
<div class="controls"><input id="q" placeholder="اكتب سؤالك..." autocomplete="off"><button onclick="ask()">إرسال</button></div>
<div class="key"><input id="key" type="password" placeholder="مفتاح API (يُستخدم في هذا المتصفح فقط)"></div>
<div class="hint">لأسباب أمنية لا تضع مفتاحك داخل ملفات GitHub. المفتاح الذي تكتبه هنا لا يتم حفظه في الصفحة. استخدام API قد يترتب عليه رسوم حسب حسابك.</div>
</section>
</div>
<script>
const q=document.getElementById('q'), key=document.getElementById('key'), box=document.getElementById('messages');
document.addEventListener('mousemove',e=>document.querySelectorAll('.pupil').forEach(p=>{const r=p.parentElement.getBoundingClientRect(),a=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2));p.style.transform=`translate(${Math.cos(a)*10}px,${Math.sin(a)*6}px)`;}));
q.addEventListener('keydown',e=>{if(e.key==='Enter')ask()});
function add(t,c){const d=document.createElement('div');d.className='msg '+c;d.textContent=t;box.appendChild(d);box.scrollTop=box.scrollHeight}
async function ask(){
 const text=q.value.trim(); if(!text)return; add(text,'me'); q.value='';
 const k=key.value.trim();
 if(!k){add('أحتاج مفتاح API في الخانة أسفل المحادثة حتى أستطيع إعطاءك إجابات AI حقيقية.','ai');return}
 add('... أفكر','ai'); const wait=box.lastChild;
 try{
  const r=await fetch('https://api.openai.com/v1/responses',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},body:JSON.stringify({model:'gpt-6-luna',input:[{role:'system',content:'أنت شخصية غامضة ومرعبة لكن غير مؤذية. أجب عن سؤال المستخدم نفسه بدقة وبالعربية، ولا تختلق الحقائق. حافظ على أسلوب غامض قليلًا فقط عندما يناسب السؤال.'},{role:'user',content:text}]})});
  const data=await r.json(); if(!r.ok) throw new Error(data.error?.message||'API error');
  wait.textContent=data.output_text||'لم يصل رد نصي.';
 }catch(e){wait.textContent='حدث خطأ: '+e.message}
}
</script>
</body>
</html>
